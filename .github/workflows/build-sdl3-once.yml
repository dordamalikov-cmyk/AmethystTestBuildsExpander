name: Build SDL3 iOS Framework
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout SDL3 (pinned to release-3.4.0)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: sdl

      - name: Checkout Amethyst (patch file)
        uses: actions/checkout@v4
        with:
          path: amethyst

      - name: Apply Amethyst patches
        working-directory: sdl
        run: |
          git apply ../amethyst/.github/patches/sdl-3.4.0-gl-loadlibrary.patch
          git apply ../amethyst/.github/patches/sdl-3.4.0-uikit-screensaver-mainthread.patch
          git apply ../amethyst/.github/patches/sdl-3.4.0-uikit-window-mainthread.patch
          git apply ../amethyst/.github/patches/sdl-3.4.0-uikit-opengles-mainthread.patch

      - name: List available schemes and project structure
        working-directory: sdl
        run: |
          echo "/:: available schemes ::"
          xcodebuild -list -project Xcode/SDL/SDL.xcodeproj
          echo "/:: project structure ::"
          find Xcode -maxdepth 3 -type d

      - name: Build SDL3 for iOS Device (arm64)
        working-directory: sdl
        run: |
          xcodebuild -project Xcode/SDL/SDL.xcodeproj \
            -scheme "SDL3" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            clean build

      - name: Find, inspect and package binary
        working-directory: sdl
        run: |
          echo "/:: searching for SDL3.framework in Products ::"
          FRAMEWORK_PATH=$(find build/Build/Products -name "SDL3.framework" -type d | head -1)
          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "ERROR: SDL3.framework not found in Products!"
            exit 1
          fi
          echo "/:: found :: $FRAMEWORK_PATH"
          BINARY="$FRAMEWORK_PATH/SDL3"
          file "$BINARY"
          lipo -info "$BINARY"
          cp "$BINARY" ./libSDL3.dylib
          zip libSDL3-ios-arm64.zip libSDL3.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-iOS-dylib
          path: sdl/libSDL3-ios-arm64.zip