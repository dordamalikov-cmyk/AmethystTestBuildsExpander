name: Build SDL3 iOS Framework
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout SDL3 (pinned to release-3.4.0 to match the bundled libSDL3.dylib)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: sdl

      - name: Checkout Amethyst (patch file)
        uses: actions/checkout@v4
        with:
          path: amethyst

      - name: Apply Amethyst patch (SDL_GL_LoadLibrary tolerates already-loaded driver)
        working-directory: sdl
        run: |
          git apply ../amethyst/.github/patches/sdl-3.4.0-gl-loadlibrary.patch

      - name: Build SDL3 dylib for iOS Device (arm64)
        working-directory: sdl
        run: |
          xcodebuild -project Xcode/SDL/SDL.xcodeproj \
            -scheme "Framework-iOS" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            clean build

      - name: Extract dylib and zip
        working-directory: sdl
        run: |
          FRAMEWORK_PATH=$(find . -path "*Release-iphoneos*" -name "SDL3.framework" -type d | head -1)
          echo "Found: $FRAMEWORK_PATH"
          BINARY="$FRAMEWORK_PATH/SDL3"
          file "$BINARY"
          lipo -info "$BINARY"
          cp "$BINARY" ./libSDL3.dylib
          zip libSDL3-ios-arm64.zip libSDL3.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-iOS-dylib
          path: sdl/libSDL3-ios-arm64.zip