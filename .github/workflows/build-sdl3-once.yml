name: Build SDL3 iOS Framework
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout SDL3 (pinned to release-3.4.0 to match the bundled libSDL3.dylib)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.0
          path: sdl

      - name: Checkout Amethyst (patch file)
        uses: actions/checkout@v4
        with:
          path: amethyst

      - name: Apply Amethyst patch (SDL_GL_LoadLibrary tolerates already-loaded driver)
        working-directory: sdl
        run: |
          git apply ../amethyst/.github/patches/sdl-3.4.0-gl-loadlibrary.patch

      - name: Build XCFramework for iOS (device, arm64)
        working-directory: sdl
        run: |
          xcodebuild -project Xcode/SDL/SDL.xcodeproj \
            -scheme "SDL3.xcframework" \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            clean build

      - name: Zip Framework
        working-directory: sdl
        run: |
          cd Xcode/SDL/Products
          zip -r SDL3.xcframework.zip SDL3.xcframework

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-iOS-Framework
          path: sdl/Xcode/SDL/Products/SDL3.xcframework.zip